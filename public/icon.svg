<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="ocean" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#144d85"/>
      <stop offset="70%" stop-color="#0a264a"/>
      <stop offset="100%" stop-color="#040e1d"/>
    </radialGradient>
    <linearGradient id="orbit" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2fe4ff"/>
      <stop offset="100%" stop-color="#ff8a3d"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="14" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <!-- Background -->
  <rect width="512" height="512" rx="115" fill="#050816"/>
  
  <!-- Outer Glow Ring -->
  <circle cx="256" cy="256" r="185" fill="none" stroke="#2fe4ff" stroke-width="2.5" opacity="0.35" stroke-dasharray="10 8" filter="url(#glow)"/>
  
  <!-- Atmosphere -->
  <circle cx="256" cy="256" r="162" fill="none" stroke="#2fe4ff" stroke-width="6" opacity="0.6" filter="url(#glow)"/>
  
  <!-- Globe Body -->
  <circle cx="256" cy="256" r="156" fill="url(#ocean)"/>
  
  <!-- Graticule Lines -->
  <ellipse cx="256" cy="256" rx="156" ry="70" fill="none" stroke="#2fd8e8" stroke-width="1.8" opacity="0.4"/>
  <ellipse cx="256" cy="256" rx="70" ry="156" fill="none" stroke="#2fd8e8" stroke-width="1.8" opacity="0.4"/>
  <line x1="100" y1="256" x2="412" y2="256" stroke="#2fd8e8" stroke-width="2" opacity="0.5"/>
  <line x1="256" y1="100" x2="256" y2="412" stroke="#2fd8e8" stroke-width="2" opacity="0.5"/>
  
  <!-- Stylized Landmasses -->
  <path d="M190 180 Q215 150 250 170 Q280 185 270 220 Q250 240 220 230 Q190 220 190 180 Z" fill="#ff8a3d" opacity="0.95"/>
  <path d="M280 230 Q330 200 360 240 Q380 270 340 310 Q300 320 290 280 Q275 250 280 230 Z" fill="#ff8a3d" opacity="0.9"/>
  <path d="M160 270 Q200 280 210 320 Q210 360 170 370 Q140 340 150 300 Z" fill="#ff8a3d" opacity="0.85"/>
  <path d="M310 160 Q340 140 365 170 Q350 200 320 190 Z" fill="#ff8a3d" opacity="0.85"/>
  
  <!-- News Signal Wave Rings -->
  <circle cx="240" cy="200" r="12" fill="#2fe4ff"/>
  <circle cx="240" cy="200" r="26" fill="none" stroke="#2fe4ff" stroke-width="3" opacity="0.85"/>
  <circle cx="240" cy="200" r="42" fill="none" stroke="#2fe4ff" stroke-width="2.5" opacity="0.55"/>
  <circle cx="240" cy="200" r="60" fill="none" stroke="#2fe4ff" stroke-width="1.8" opacity="0.3"/>
  
  <!-- Diagonal Orbit -->
  <ellipse cx="256" cy="256" rx="205" ry="58" fill="none" stroke="url(#orbit)" stroke-width="5" transform="rotate(-30 256 256)"/>
  <circle cx="430" cy="155" r="9" fill="#2fe4ff" filter="url(#glow)"/>
</svg>
